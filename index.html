<!doctype html>
<html lang=ko>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기초생활중국어 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf2f1; --card:#fbfdfc; --ink:#14302b; --muted:#5d746f; --line:#d3e0dc;
  --blue:#1f4e9c; --blue-soft:#e3ebf8; --ok:#1c7f55; --ok-soft:#dff2e8; --warn:#9a5b00; --warn-soft:#fbefd6;
  --bad:#b3372c; --grid:#b9cdc8;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hanzi:"Noto Serif SC","Songti SC","Noto Serif CJK SC","SimSun",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1620; --card:#16222f; --ink:#e6f0ee; --muted:#9bb2ad; --line:#2a3b4a;
    --blue:#8fb0ff; --blue-soft:#1e2e4d; --ok:#5cc48f; --ok-soft:#163528; --warn:#e8b25a; --warn-soft:#3a2e14;
    --bad:#ff8a7c; --grid:#38505a;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1620; --card:#16222f; --ink:#e6f0ee; --muted:#9bb2ad; --line:#2a3b4a;
  --blue:#8fb0ff; --blue-soft:#1e2e4d; --ok:#5cc48f; --ok-soft:#163528; --warn:#e8b25a; --warn-soft:#3a2e14;
  --bad:#ff8a7c; --grid:#38505a;
}
/* 제출 화면 '연습이 필요한 문장' 전용 색: 모든 기기에서 푸른색(정확한 발음) / 연한 붉은색(연습할 발음) */
:root{--tg:var(--blue); --tb:#c8625a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--tb:#f0a095} }
:root[data-theme="dark"]{--tb:#f0a095}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-bottom:84px;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:15px;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.namerow{display:flex;gap:8px;align-items:stretch}
.namerow .name{flex:1;min-width:0;width:auto;text-overflow:ellipsis}
.clssel{flex:none;width:auto;max-width:96px;padding:11px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.clssel.sel{border-color:var(--blue);color:var(--blue);font-weight:700}
.clssel.need{border-color:var(--bad);color:var(--bad)}
.name{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -14px;padding-left:14px;padding-right:14px}
.chip{white-space:nowrap;flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;min-width:132px}
.chip b{font-size:14px}
.chip b::after{content:' · ';font-weight:400;color:var(--muted)}
.chip span{font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--blue);background:var(--blue-soft)}
.chip.done span{color:var(--ok);font-weight:700}
.langs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.lg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.lg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0}
.s{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.s.pass{border-color:var(--ok)}
.s.locked{opacity:.62}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.cell{width:46px;height:46px;display:grid;place-items:center;font-family:var(--hanzi);font-size:28px;line-height:1;
  border:1.5px solid var(--grid);border-radius:3px;
  background:
    linear-gradient(to right,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px)) ,
    linear-gradient(to bottom,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px));
  background-size:100% 100%;opacity:1}
.cell span{position:relative;z-index:1}
.punc{font-family:var(--hanzi);font-size:24px;align-self:end;padding-bottom:6px;color:var(--muted)}
.py{font-size:15px;color:var(--blue);font-weight:500;margin:0}
.mean{font-size:15px;margin:2px 0 10px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 6px;cursor:pointer;min-height:44px}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.lockd{opacity:.4}
.b.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.b.playing{background:var(--blue);color:#fff;border-color:var(--blue);animation:plpulse 1s ease-in-out infinite}
.b.failed{border-color:var(--bad);color:var(--bad)}
@keyframes plpulse{0%,100%{opacity:1}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.b.playing{animation:none}}
:root[data-theme="dark"] .b.pri{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b.pri{color:#0b1220}}
.b.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
/* 본문 버튼: 두 줄 모두 3열 */
.btns.bw{grid-template-columns:repeat(3,minmax(0,1fr))}
.btns.bw .b{padding:10px 4px}
.b.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--blue)}
.meter.good i{background:var(--ok)}
.res{font-size:13px;color:var(--muted);margin:2px 0}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card2 h2{font-size:17px;margin:0 0 6px}
.card2 p{margin:6px 0}
a.lk{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;color:var(--blue);text-decoration:none;font-size:14px}
textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.q{margin:14px 0}
.q p{font-weight:700;margin:0 0 8px}
.o{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0;cursor:pointer}
.o.right{background:var(--ok-soft);border-color:var(--ok)}
.o.wrong{background:var(--warn-soft);border-color:var(--bad)}
.checkrow{padding:12px 0;border-bottom:1px dashed var(--line)}
.checkrow:last-child{border-bottom:0}
.checksentence{font-family:var(--hanzi);font-size:20px;font-weight:600}
.checkpy{font-size:13px;color:var(--blue);margin:2px 0}
.checkko{font-size:14px;color:var(--muted);margin:2px 0 8px}
.checkopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.checkopt{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px 4px;font-size:13px;cursor:pointer}
.checkopt.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}
.scale button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 4px;cursor:pointer}
.scale button.sel{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:800}
.checkstatus{font-size:13px;color:var(--muted);margin:8px 0}

.stamp{border:2px solid var(--ok);border-radius:14px;padding:14px;text-align:center;margin:10px 0 14px;background:var(--ok-soft)}
.stamp.no{border-color:var(--warn);background:var(--warn-soft)}
.stamp b{font-size:26px;display:block;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.todo{margin:8px 0 0;padding-left:18px;font-size:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
@media (min-width:560px){nav{max-width:532px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
nav button{flex:1;border:0;background:transparent;padding:10px 4px 9px;font-size:13px;color:var(--muted);cursor:pointer;min-height:56px}
nav button.on{color:var(--blue);font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
nav button em{display:block;font-style:normal;font-size:20px;line-height:1.1}
.hz{font-family:var(--hanzi);font-size:22px}
.py2{font-size:13px;color:var(--blue);margin-left:6px;font-family:var(--sans);font-weight:500}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px}
.help summary{cursor:pointer;font-weight:700;color:var(--blue)}
.help ul{margin:8px 0 2px;padding-left:18px}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.small{font-size:12px;color:var(--muted)}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:8px 0}

.lbl{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:6px 0 2px}
.cell.hit{border-color:var(--ok);background-color:var(--ok-soft)}
.cell.miss{border-color:var(--warn);border-style:dashed;background-color:var(--warn-soft)}
.py,.mean{white-space:pre-line}
.hr{color:var(--tb);font-weight:700;text-decoration:underline dotted}
.help ol{margin:8px 0 2px;padding-left:20px}
.wl>summary{cursor:pointer;font-size:16px;font-weight:800;margin-bottom:6px}
.okmark{color:var(--ok);font-weight:800;margin-left:6px}
.hrd{font-size:15px;margin:2px 0;color:var(--muted)}
.hz2{font-size:22px;font-weight:600;color:var(--ink)}
.help li{margin:4px 0}
.help.zh{font-family:var(--hanzi),"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.vw{padding:10px 0;border-bottom:1px dashed var(--line)}
.vw:last-child{border-bottom:0}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px}
/* 단어 카드 배치(전 과 공통): 한자·병음 | 듣기 | 말하기 / 뜻 | 비교하기(말하기 아래) */
.vg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;align-items:center}
.vg .vg-a{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;min-width:0}
.vg .vg-a .py2{margin-left:0}
.vg .b{min-height:40px;font-size:13px;padding:6px 10px;white-space:nowrap}
.vg .vg-m{grid-column:1 / 3;font-size:14px;color:var(--ink);text-align:left;min-width:0}
.vg .vg-c{grid-column:3}
.vg .res{grid-column:1 / -1;margin:0}
.lamp{display:flex;align-items:center;justify-content:center;padding:4px 2px;font-size:15px;line-height:1.2;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);user-select:none;text-align:center}
.lamp:not(.on){opacity:.4}
.lamp.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
#tabs .lk{opacity:.45}
.rsrow{text-align:center;margin:4px 0 12px}
</style>
</head>

function norm(t){ return String(t||'').replace(/[\s\p{P}\p{S}]/gu,''); }
/* 교재 글자(a) 중 학생이 말한 글자(b)와 순서대로 맞은 글자를 true로 표시 */
/* 말하기 비교용: 발음이 같은 他·她·它·牠(모두 tā)는 같은 글자로 취급. 쓰기 구분에는 영향 없음 */
const TA_SAME={'她':'他','它':'他','牠':'他'};
function sp(c){ return TA_SAME[c]||c; }
function lcsMark(a,b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]= sp(a[i-1])===sp(b[j-1]) ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(m).fill(false);
  let i=m, j=n;
  while(i>0 && j>0){
    if(sp(a[i-1])===sp(b[j-1])){ hit[i-1]=true; i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--;
    else j--;
  }
  return hit;
}
function scoreOf(target, said){
  const a=[...norm(target)], b=[...norm(said)];
  if(!a.length) return {sc:0, hit:[]};
  const hit=lcsMark(a,b);
  const sc=Math.round(hit.filter(Boolean).length/Math.max(a.length,b.length,1)*100);
  return {sc, hit};
}

/* 연습할 말: 점수 결과에서 맞지 않은 글자를 이어진 덩어리로 묶어 순서대로 돌려줌 */
function missedParts(zh, marks){
  const a=[...norm(zh)], out=[]; let cur='';
  for(let k=0;k<a.length;k++){
    if(marks && marks[k]==='0') cur+=a[k];
    else if(cur){ out.push(cur); cur=''; }

  return out;
}

function recMime(){
  if(typeof MediaRecorder==='undefined') return '';
  const ts=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg;codecs=opus'];
  return ts.find(t=>MediaRecorder.isTypeSupported(t))||'';
}
async function getMic(){
  clearTimeout(micTimer);
  if(micStream && micStream.getAudioTracks().some(t=>t.readyState==='live')) return micStream;
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  return micStream;
}
function releaseMic(){ clearTimeout(micTimer); if(micStream){ try{micStream.getTracks().forEach(t=>t.stop());}catch(e){} micStream=null; } }
function armMicIdle(){
  clearTimeout(micTimer);
  /* 폰에 마이크를 붙잡아 두면 다음 말하기의 음성 인식이 침묵만 듣습니다 */
 if(isPhone) releaseMic();
  else micTimer=setTimeout(releaseMic,120000);
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(tcur) stopTextRecording(); if(wcur) stopWord(); if(!tcur && !wcur) releaseMic(); } });
function attachSR(c){
  if(!SR) return;
  const bind=cont=>{
    const rec=new SR();
    rec.lang='zh-CN';
    rec.interimResults=true;
    rec.continuous=cont;
    rec.maxAlternatives=3;
    rec.onresult=ev=>{
      c.srErr='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r=ev.results[i];
        c.recParts[i]={text:(r[0]&&r[0].transcript||'').trim(),final:!!r.isFinal};
      }
      const all=c.recParts.filter(Boolean);
      c.full=all.map(x=>x.text).join('');
      const finals=all.filter(x=>x.final).map(x=>x.text).filter(Boolean);
      c.texts=finals.length?finals:[c.full].filter(Boolean);
    };
    rec.onerror=ev=>{
      c.srErr=ev.error||'';
      if(ev.error==='language-not-supported' && rec.lang==='zh-CN'){
        try{ rec.lang='cmn-Hans-CN'; }catch(e){}
      }
      /* 다시 켜도 소용없는 오류는 재시작을 멈춥니다(아이폰 인식 서비스가 꼬이는 것을 막음) */
      if(['aborted','not-allowed','service-not-allowed','network','audio-capture'].includes(ev.error)) c.noRestart=true;
    };

    /* 폰은 잠깐 쉬면 인식이 끝나 버립니다. 끝내기 전까지 다시 켭니다 (오류가 났거나 6번 넘으면 멈춤) */
    rec.onend=()=>{
      if(c.stopping||c.final||c.noRestart) return;
      c.restarts=(c.restarts||0)+1;
      if(c.restarts>6) return;
      try{ rec.start(); }catch(e){}
    };
    rec.start();
    c.sr=rec;
  };
  try{ bind(true); }
  catch(e){
    try{ bind(false); }
    catch(e2){ c.sr=null; }
  }
}
async function startRec(k,i){
  if(cur||tcur||wcur) return;
  const l=lesson(), key=l.id+':'+k+':'+i, s=items(l,k)[i];
  const pair=String(s.zh).includes('\n');
  if(synth) synth.cancel();
  stopRef();
  const dd=D(l.id)[k];
  /* 말하기를 시작하면 현재 완료를 끄고, 이전 피드백을 지워 이번 결과로 교체합니다. */
  dd.cd[i]=false; delete dd.marks[i]; delete dd.heard[i]; delete dd.fr[i]; needsRecording[key]=true;
  const c={key,k,i,lid:l.id,chunks:[],texts:[],recParts:[],full:'',target:s.zh,srErr:''};
  cur=c; msg[key]=''; save(); renderCard(k,i);
  /* 폰: 직전에 재생·녹음하던 소리와 마이크를 먼저 정리하고 잠깐(0.35초) 기다린 뒤 인식을 시작합니다.
     (아이폰은 소리 설정이 바뀌는 중에 인식을 켜면 무음만 듣는 경우가 있음. 너무 길면 터치 허용 시간을 넘기므로 짧게 유지) */
  if(playing){ try{playing.pause();}catch(e){} }
  if(isPhone){ releaseMic(); await new Promise(r=>setTimeout(r,350)); if(c.stopping||c.final) return; }
  /* 말하기는 음성 인식 전용입니다. 녹음은 별도 버튼에서 수행합니다. */
  attachSR(c);
  if(!c.sr){
    cur=null; msg[key]='noSR'; dd.st[i]='srFail'; save(); renderCard(k,i); return;
  }
  c.timer=setTimeout(stopRec,6000);
}
function stopRec(){
  if(!cur||cur.stopping) return;
  const c=cur; c.stopping=true; clearTimeout(c.timer);
  try{ c.sr && c.sr.stop(); }catch(e){}
  try{ if(c.mr && c.mr.state!=='inactive') c.mr.stop(); }catch(e){}
  setTimeout(()=>finalize(c), isPhone?900:600);
  renderCard(c.k,c.i);
}

const EV=()=>EVI18N[S.lang]||EVI18N.ko;
function srFailMsg(err){
  if(err==='not-allowed') return 'notAllowed';
  if(err==='language-not-supported') return 'langUnsupported';
  if(err==='network' || err==='service-not-allowed') return 'network';
  return 'noSpeech';
}
function finalize(c){
  if(c.final) return; c.final=true; if(cur===c) cur=null;
  /* 인식기를 확실히 닫아 다음 말하기와 겹치지 않게 합니다(아이폰은 동시에 하나만 가능) */
  if(c.sr){ try{ c.sr.onresult=c.sr.onerror=c.sr.onend=null; c.sr.abort(); }catch(e){} }
  if(isPhone && !tcur && !wcur) releaseMic();   /* 다음 말하기를 위해 폰 마이크를 확실히 놓습니다 */
  const d=D(c.lid)[c.k]; d.tried[c.i]=true; d.tc[c.i]=(d.tc[c.i]||0)+1;
  if(SR){
    const cands=c.texts.slice(); if(c.full) cands.push(c.full);
    if(cands.length){
      let best=-1, bt='', bh=[];
      cands.forEach(t=>{ const r=scoreOf(c.target,t); if(r.sc>best){ best=r.sc; bt=t; bh=r.hit; } });
      /* 매번 이번 시도의 인식 결과로 피드백을 덮어씁니다. 점수는 화면에 표시하지 않습니다. */
      d.best[c.i]=best; d.marks[c.i]=bh.map(x=>x?'1':'0').join(''); d.heard[c.i]=bt;
      delete d.fr[c.i]; d.st[c.i]='ok'; msg[c.key]='';
      /* 붉은 글자가 없을 때만 말하기 직후 완료 처리합니다. */
      if(!d.marks[c.i].includes('0')){ d.cd[c.i]=true; d.ce[c.i]=true; }
      else d.cd[c.i]=false;
    }else{
      const mk=srFailMsg(c.srErr);
      msg[c.key]=mk;
      d.st[c.i]=(mk==='noSpeech')?'noSpeech':(mk==='notAllowed'?'micFail':'srFail');
      delete d.marks[c.i]; delete d.heard[c.i]; d.cd[c.i]=false;
      if(mk==='noSpeech'){ delete d.fr[c.i]; } else { d.fr[c.i]=mk; }
    }
  }else{
    msg[c.key]='noSR'; d.fr[c.i]='noSR'; d.st[c.i]='srFail'; d.cd[c.i]=false;
  }
  save();
  if(lesson().id===c.lid){ renderCard(c.k,c.i); renderChips(); renderTabs(); }
}

const isPunc=ch=>/[\p{P}\p{S}\s]/u.test(ch);
/* marks: 글자별 '1'(잘 들림) / '0'(다시 들어 보기) 문자열. 줄바꿈이 있으면 질문/대답 두 줄로 보여 줍니다 */
function cells(zh, marks){
  let idx=0;
  const lines=String(zh).split('\n'), pair=lines.length>1;
  return lines.map((line,li)=>{
    const lab=pair?'<span class="lbl">'+(li===0?'질문':'대답')+'</span>':'';
    const cs=[...line].map(ch=>{
      if(isPunc(ch)) return '<span class="punc">'+esc(ch)+'</span>';
      const m=marks?marks[idx]:null; idx++;
      const cls= m==='1' ? ' hit' : (m==='0' ? ' miss' : '');
      return '<div class="cell'+cls+'"><span>'+esc(ch)+'</span></div>';
    }).join('');
    return lab+'<div class="cells" lang="zh-CN">'+cs+'</div>';
  }).join('');
}
function practiceHTML(s,d,i){
  const parts=missedParts(s.zh, d.marks[i]);
  if(!parts.length) return '';
  return '<p class="hrd">'+esc(EV().prac)+': <span class="hz2" lang="zh-CN">'+esc(parts.join(' / '))+'</span></p>';
}

/* 별도 녹음: 말하기 음성 인식과 마이크를 동시에 사용하지 않습니다. */
async function startTextRecording(i){
  if(tcur||cur||wcur) return;
  const l=lesson(), key=l.id+':p:'+i;
  if(synth) synth.cancel(); stopRef();
  const c={key,i,lid:l.id,k:'p',chunks:[],stopping:false,done:false};
  const pd=D(l.id).p; pd.cc[i]=0; pd.cd[i]=false; save();
  tcur=c; needsRecording[key]=true; msg[key]=''; renderCard('p',i);
  try{
    c.stream=await getMic();
    if(c.stopping || tcur!==c) return;
    const mime=recMime();
    c.mr=mime?new MediaRecorder(c.stream,{mimeType:mime}):new MediaRecorder(c.stream);
    c.mr.ondataavailable=e=>{ if(e.data && e.data.size) c.chunks.push(e.data); };
    c.mr.onstop=()=>finishTextRecording(c);
    c.mr.start(250);
    { const pd=D(l.id).p; pd.tc[i]=(pd.tc[i]||0)+1; save(); } /* 본문 말하기 시작 횟수 */
    c.timer=setTimeout(stopTextRecording,8000);   /* 8초 뒤 자동 종료 */
    watchVoice(c);   /* 목소리가 있었는지 음량으로 기록 (단어 연습과 같은 방식) */
  }catch(e){
    if(tcur===c) tcur=null;
    const pd=D(l.id).p; pd.st[i]='micFail'; pd.me[i]=(pd.me[i]||0)+1;
    msg[key]='noMic'; save(); armMicIdle(); renderCard('p',i); return;
  }
  renderCard('p',i);
}
function stopTextRecording(){
  const c=tcur; if(!c||c.stopping) return;
  c.stopping=true; clearTimeout(c.timer);
  try{ if(c.mr && c.mr.state!=='inactive') c.mr.stop(); else finishTextRecording(c); }
  catch(e){ finishTextRecording(c); }
  if(lesson().id===c.lid) renderCard('p',c.i);
}
function finishTextRecording(c){
  if(c.done) return; c.done=true; clearTimeout(c.timer); if(tcur===c) tcur=null;
  if(c.vstop) c.vstop();
  if(c.chunks.length){
    if(audioURL[c.key]){ try{URL.revokeObjectURL(audioURL[c.key]);}catch(e){} }
    audioURL[c.key]=URL.createObjectURL(new Blob(c.chunks,{type:(c.mr&&c.mr.mimeType)||'audio/webm'}));
    needsRecording[c.key]=false;
    /* 목소리 감지 결과 기록 (음량 감지가 안 되는 기기는 감지된 것으로 봄). 무음이어도 비교하기는 막지 않음 */
    const heard=c.meter ? c.voiced>=VOICE_FRAMES : true;
    const d=D(c.lid).p; d.st[c.i]=heard?'ok':'noVoice';
    if(!heard) d.nv[c.i]=(d.nv[c.i]||0)+1;
    delete d.fr[c.i]; msg[c.key]=heard?'':'noVoice'; save();
  }else{
    const d=D(c.lid).p; d.st[c.i]='noVoice'; d.nv[c.i]=(d.nv[c.i]||0)+1;
    msg[c.key]='noVoice'; save();
  }
  armMicIdle();
  if(lesson().id===c.lid && S.tab==='practice'){ renderCard('p',c.i); renderChips(); }
}
/* 비교하기: 원어민 음성 → 학생 녹음 음성. 재생 1회가 끝날 때마다 횟수를 기록 */
function textCompare(l,i){
  const lid=l.id, key=lid+':p:'+i;
  if(!audioURL[key] || needsRecording[key] || (i>0 && !iPass(l,'p',i-1))) return;
  const counted=()=>{
    const dd=D(lid).p;
    dd.cc[i]=Math.min(2,(+dd.cc[i]||0)+1);
    if(dd.cc[i]>=2){ dd.cd[i]=true; dd.ce[i]=true; }
    save();
    if(lesson().id===lid && S.tab==='practice'){
      renderCard('p',i);
      if(dd.cc[i]>=2 && i+1<l.sentences.length) renderCard('p',i+1);
      renderChips(); renderTabs();
    }
  };
  const mine=()=>playMine(key,counted);

  return '<p class="small" id="qprog">'+esc(G.progress(x,n))+'</p><p class="small" id="qhint">'+esc(ok?G.ready:G.lock)+'</p>'+
    '<button class="b pri" id="qopenbtn" data-act="qopen"'+(ok?'':' disabled')+'>'+esc(G.startBtn)+'</button>';

function updGate(){
  const l=lesson(); if(S.tab!=='vocab' || quizOpen(l)) return;
  const n=l.vocab.length, x=wordsDoneCount(l), ok=x>=n, G=VG();
  const p=$('qprog'), h=$('qhint'), b=$('qopenbtn'), w=$('wprog');
  if(p) p.textContent=G.progress(x,n);
  if(h) h.textContent=ok?G.ready:G.lock;
  if(b) b.disabled=!ok;
  if(w) w.textContent=G.progress(x,n);
}

/* 단어 말하기: 점수·판정 없이 녹음 → 내 소리 듣기 → 원어민과 비교 (음성 인식은 쓰지 않음) */
/* 녹음 중 마이크 음량을 재서 목소리가 있었는지 기록(제출 화면의 '소리 없음' 표시용). ✔는 비교 재생이 끝났을 때 표시.
   너무 예민하면 VOICE_RMS 값을 낮추고(예 0.02), 조용한 소리도 통과되면 높이세요(예 0.05). */
const VOICE_RMS=0.03, VOICE_FRAMES=4;
function watchVoice(c){
  c.meter=false; c.voiced=0;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(); if(ctx.resume) ctx.resume();
    const src=ctx.createMediaStreamSource(c.stream), an=ctx.createAnalyser();
    an.fftSize=1024; src.connect(an);
    const buf=new Uint8Array(an.fftSize);
    c.meter=true;
    c.vt=setInterval(()=>{
      try{
        an.getByteTimeDomainData(buf);
        let sum=0; for(let k=0;k<buf.length;k++){ const v=(buf[k]-128)/128; sum+=v*v; }
        if(Math.sqrt(sum/buf.length)>VOICE_RMS) c.voiced++;
      }catch(e){ c.meter=false; }
    },50);
    c.vstop=()=>{ clearInterval(c.vt); try{src.disconnect();}catch(e){} try{ctx.close();}catch(e){} };
  }catch(e){ c.meter=false; }
}
let wcur=null; const wmsg={};

  const rec=!!(wcur && wcur.key===key && !wcur.stopping), has=!!audioURL[key], canCmp=has || D(l.id).wst[i]==='micFail';
  const meaning=esc(w[ML()]||w.ko);
  const m=wmsg[key]?'<p class="res" style="color:var(--warn)">'+esc(VT()[wmsg[key]]||'')+'</p>':'';

    '<div class="vg-a"><b class="hz" lang="zh-CN">'+esc(w.zh)+'</b><span class="py2">'+esc(w.py)+'</span>'+(D(l.id).wdone[i]?'<span class="okmark">✔</span>':'')+'</div>'+
    '<button class="b" data-act="vsay" data-i="'+i+'">'+esc(T.listen)+'</button>'+
    (rec?'<button class="b rec" data-act="wstop" data-i="'+i+'">'+esc(T.stop)+'</button>':'<button class="b" data-act="wrec" data-i="'+i+'">'+esc(T.speak)+'</button>')+
    '<span class="vg-m">'+meaning+'</span>'+
    '<button class="b vg-c" data-act="wcmp" data-i="'+i+'"'+(canCmp?'':' disabled')+'>'+esc(T.cmp)+'</button>'+
    m+'</div>';
}
/* 단어 비교하기: 원어민 → 내 소리 순서로 끝까지 재생하면 ✔. 녹음이 없는 기기는 원어민 재생이 끝나면 ✔ */
function wordCompare(l,i){
  const lid=l.id, key=lid+':v:'+i, fin=()=>markWordDone(lid,i);
  const mine=()=>{ if(!audioURL[key]){ fin(); return; } playMine(key,fin); };
  if(!playRef(l.vocab[i],0.9,()=>setTimeout(mine,300))) mine();
}
function markWordDone(lid,i){
  const d=D(lid); d.wdone[i]=true; d.wever[i]=true; save();
  if(lesson().id===lid && S.tab==='vocab'){ renderWord(i); updGate(); renderTabs(); }
}
function renderWord(i){ const l=lesson(), el=$('vw'+i); if(el && l.vocab[i]) el.outerHTML=vwHTML(l,i); }
async function startWord(i){
  if(wcur||cur||tcur) return;
  const l=lesson(), key=l.id+':v:'+i;
  if(synth) synth.cancel();
  stopRef();
  const c={key,i,lid:l.id,chunks:[]};
  wcur=c; wmsg[key]=''; renderWord(i);
  try{
    c.stream=await getMic();
    const mime=recMime();
    c.mr=mime?new MediaRecorder(c.stream,{mimeType:mime}):new MediaRecorder(c.stream);
    c.mr.ondataavailable=e=>{ if(e.data && e.data.size) c.chunks.push(e.data); };
    c.mr.onstop=()=>finishWord(c);
    c.mr.start(250);
    watchVoice(c);
    { const dw=D(l.id); dw.wtc[i]=(dw.wtc[i]||0)+1; save(); }      /* 말하기 시작 횟수 */
  }catch(e){
    /* 마이크를 못 쓰는 폰: 횟수는 세지 않고 상태만 기록. 비교하기(원어민 재생)는 그대로 눌러서 ✔ 가능 */
    wcur=null; wmsg[key]='micFail'; D(l.id).wst[i]='micFail'; save();
    renderWord(i); return;
  }
  c.timer=setTimeout(stopWord,3000);
}
function stopWord(){
  const c=wcur; if(!c||c.stopping) return;
  c.stopping=true; clearTimeout(c.timer);
  try{ if(c.mr && c.mr.state!=='inactive') c.mr.stop(); else finishWord(c); }catch(e){ finishWord(c); }
  if(lesson().id===c.lid) renderWord(c.i);
}
function finishWord(c){
  if(c.done) return; c.done=true; if(wcur===c) wcur=null;
  armMicIdle();
  if(c.vstop) c.vstop();
  if(c.chunks.length){
    if(audioURL[c.key]) URL.revokeObjectURL(audioURL[c.key]);
    audioURL[c.key]=URL.createObjectURL(new Blob(c.chunks,{type:(c.mr&&c.mr.mimeType)||'audio/webm'}));
    /* 목소리 감지 결과만 기록 (음량 감지가 안 되는 기기는 감지된 것으로 봄) */
    const heard=c.meter ? c.voiced>=VOICE_FRAMES : true;
    D(c.lid).wst[c.i]=heard?'ok':'noVoice'; save();
    if(!heard) wmsg[c.key]='noVoice';
  }
  if(lesson().id===c.lid && S.tab==='vocab'){ renderWord(c.i); updGate(); }
}

      kv('점검',checkDone(l)?'완료':'미실시')+
      kv('전체 자신감',d.check.confidence==null?'미응답':d.check.confidence+' / 5')+
      (checkDone(l)?'<p style="margin:12px 0 2px"><b>문장별 말하기 자신감</b></p><ul class="todo">'+l.sentences.map((q,i)=>'<li>'+(i+1)+'번 문장 '+esc(q.zh||'')+': '+({confident:'자신 있어요',normal:'보통이에요',difficult:'어려워요'}[d.check.sentences[i]]||'미선택')+'</li>').join('')+'</ul>':'<p class="notice">점검을 하지 않았습니다. 말하기 자신감을 기록하려면 점검 메뉴에서 선택한 뒤 다시 제출 화면으로 오세요.</p>')+
      (checkDone(l)&&d.check.memo?'<p style="margin:10px 0 2px"><b>말하기 어려운 이유 / 하고 싶은 말</b><br>'+esc(d.check.memo).replace(/\n/g,'<br>')+'</p>':'')+
      '</div>';
  }
  $('view').innerHTML=h;
}
function practiceStartText(d){
  const pt=d.pt; if(!pt||!pt.f) return '기록 없음';
  const a=kstParts(pt.f);
  let t=pad2(a.m)+'/'+pad2(a.d)+' '+pad2(a.hh)+':'+pad2(a.mm);
  const cs=(pt.c||'').split(',').filter(Boolean);
  if(cs.length && (cs.length>1 || cs[0]!==S.cls)) t+=' · 연습한 반: '+cs.map(c=>c+'반').join('·');
  return t;
}
function render(){ renderTabs(); renderChips(); renderView(); }

/* ----- 이벤트 ----- */
const NAME_PH='이름 / Name';
function syncNameUI(){
  const has=!!(S.name||'').trim();
  if(has){ $('name').classList.remove('need'); $('name').placeholder=NAME_PH; }
}
/* 이름이 비어 있으면 말하기·퀴즈를 막고 이름 칸에 안내를 보여 줍니다 */
/* 반을 고르지 않았거나 이름이 비어 있으면 말하기·퀴즈를 막고 안내 팝업을 보여 줍니다 (둘 다 없으면 한 번에 안내) */
function nameMissing(){
  if(S.name && S.nameDate!==todayStr()){ S.name=''; S.nameDate=''; $('name').value=''; save(); }
  return !(S.name||'').trim();
}
function needInfo(){
  const noC=!S.cls, noN=nameMissing();
  if(!noC && !noN) return false;
  if(noC) $('cls').classList.add('need');
  if(noN){ const n=$('name'); n.classList.add('need'); n.placeholder=RTX().name; }
  window.scrollTo(0,0);
  alert(noC&&noN ? RTX().both : (noC ? RTX().cls : RTX().name));
  if(noN && !noC){ try{ $('name').focus(); }catch(e){} }
  return true;
}
$('name').value=S.name||'';
syncNameUI();
$('cls').addEventListener('change',e=>{
  if(cur||wcur||tcur){ alert(RTX().rec); e.target.value=S.cls||''; return; }
  S.cls=e.target.value; save(); render();
});
$('name').addEventListener('blur',e=>{ e.target.scrollLeft=0; });
$('name').addEventListener('input',e=>{ S.name=e.target.value; S.nameDate=(S.name.trim()?todayStr():''); save(); syncNameUI(); });
document.addEventListener('input',e=>{
  if(e.target && e.target.id==='checkMemo'){ const d=D(lesson().id); d.check.memo=e.target.value; save(); }
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, l=lesson(), i=+b.dataset.i, k=b.dataset.k, d=D(l.id);
  /* 연습 동작은 반·이름이 있고 이 과의 수업 시간일 때만 */
  if(['rec','trec','wrec','cmp','wcmp','vans','ans','qopen','sreset','preset','wreset','vreset','quizreset','qplay','checkSentence','checkConfidence'].includes(a)){
    if(needInfo()) return;
    if(lessonWindow(l.id)!=='open'){ alert(TM().closed); return; }
    if(['rec','trec','wrec','vans','ans','qopen','qplay'].includes(a)) stampPractice(l.id);
  }
  if(a==='tab'){ const bk=tabBlock(l,b.dataset.id); if(bk){ if(bk==='info') needInfo(); else alert(TM()[bk]); return; } if(wcur) stopWord(); if(tcur) stopTextRecording(); S.tab=b.dataset.id; if(S.tab!=='practice' && !tcur && !wcur) releaseMic(); save(); render(); window.scrollTo(0,0); }
  else if(a==='lesson'){ userPicked=true; if(cur) stopRec(); if(wcur) stopWord(); if(tcur) stopTextRecording(); S.lesson=b.dataset.id; S.tab='vocab'; save(); render(); }
  else if(a==='lang'){ S.lang=b.dataset.id; save(); renderChips(); renderView(); }
  else if(a==='say'){ playVocab(b, items(l,k)[i], +b.dataset.r); }
  else if(a==='rec'){ startRec(k,i); }
  else if(a==='stop'){ stopRec(); }
  else if(a==='trec'){ startTextRecording(i); }
  else if(a==='tstop'){ stopTextRecording(); }
  else if(a==='mine'){ playMine(l.id+':'+k+':'+i); }
  else if(a==='cmp'){ textCompare(l,i); }
  else if(a==='sreset'){
    const key=l.id+':'+k+':'+i, dd=d[k];
    if(cur && cur.key===key) return;
    if(dd.cd[i] && !confirm(RTX().one)) return;
    if(dd.cd[i] || dd.tried[i] || audioURL[key]) dd.rs=(dd.rs||0)+1;
    ['best','tried','marks','heard','fr','cd','cc'].forEach(f=>{ delete dd[f][i]; });
    if(audioURL[key]){ try{ URL.revokeObjectURL(audioURL[key]); }catch(e){} delete audioURL[key]; }
    delete msg[key];
    save(); renderCard(k,i); renderChips(); renderTabs();
  }
  else if(a==='preset'){
    if(cur||tcur){ alert(RTX().rec); return; }
    if(!confirm(TM().pall)) return;
    const dd=d.p;
    if(l.sentences.some((_,j)=>dd.cd[j] || (+dd.cc[j]||0)>0 || dd.tried[j] || audioURL[l.id+':p:'+j])) dd.rs=(dd.rs||0)+1;
    l.sentences.forEach((_,j)=>{
      ['best','tried','marks','heard','fr','cd','cc'].forEach(f=>{ delete dd[f][j]; });
      const key=l.id+':p:'+j;
      if(audioURL[key]){ try{ URL.revokeObjectURL(audioURL[key]); }catch(e){} delete audioURL[key]; }
      delete msg[key];
    });
    save(); renderView(); renderChips(); renderTabs();
  }
  else if(a==='wreset'){
    if(wcur){ alert(RTX().rec); return; }
    if(!confirm(TM().wall)) return;
    if(Object.keys(d.wdone).length>0 || l.vocab.some((_,j)=>audioURL[l.id+':v:'+j])) d.wrs=(d.wrs||0)+1;
    d.wdone={};
    l.vocab.forEach((_,j)=>{
      const key=l.id+':v:'+j;
      if(audioURL[key]){ try{ URL.revokeObjectURL(audioURL[key]); }catch(e){} delete audioURL[key]; }
      delete wmsg[key];
    });
    save(); renderView(); renderChips();
  }
  else if(a==='qplay'){ const q=+b.dataset.q; const item=l.quiz[q]; if(item && item.au){ const sent=l.sentences.find(x=>x.au===item.au); if(sent) playRef(sent,1); } }
  else if(a==='ans'){ const q=+b.dataset.q; if(d.quiz[q]==null){ d.quiz[q]=+b.dataset.o; if(quizDone(l)) d.qh.push(quizScore(l)); save(); renderView(); renderChips(); renderTabs(); } }
  else if(a==='checkSentence'){ d.check.sentences[+b.dataset.i]=b.dataset.value; save(); renderView(); renderTabs(); }
  else if(a==='checkConfidence'){ d.check.confidence=+b.dataset.value; save(); renderView(); renderTabs(); }
  else if(a==='quizreset'){ d.quiz={}; d.u.c=false; d.u.s=false; save(); renderView(); renderTabs(); renderChips(); }
  else if(a==='vsay'){ playVocab(b, l.vocab[i], 1); }
  else if(a==='qopen'){ if(wordsDoneCount(l)>=l.vocab.length){ d.qopen=true; vqClosed=false; save(); renderView(); const q=$('vquiz'); if(q) q.scrollIntoView({block:'start'}); } }
  else if(a==='wrec'){ startWord(i); }
  else if(a==='wstop'){ stopWord(); }
  else if(a==='wmine'){ playMine(l.id+':v:'+i); }
  else if(a==='wcmp'){ wordCompare(l,i); }
  else if(a==='vans'){ const q=+b.dataset.q; if(d.vq[q]==null){ d.vq[q]=+b.dataset.o; if(vocabDone(l)) d.vh.push(vocabScore(l)); save(); renderView(); renderChips(); renderTabs(); } }
  else if(a==='vreset'){ d.vq={}; save(); renderView(); renderChips(); }
});
/* 앱을 열 때 이번 주의 첫 과를 보여 줍니다. 10/28(수)부터 7일 단위로 2과씩 (11·13·15·17·19과). 10/28 이전은 11과, 마지막 주 이후는 19과 */
const WEEK_START='2026-10-28', WEEK_FIRST=['l11','l13','l15','l17','l19'];
let userPicked=false;
function applyWeekLesson(){
  if(userPicked || cur||wcur||tcur) return;
  const p=kstParts(nowMs()), a=WEEK_START.split('-');
  const diff=Math.floor((Date.UTC(p.y,p.m-1,p.d)-Date.UTC(+a[0],+a[1]-1,+a[2]))/86400000);
  const wk=Math.min(WEEK_FIRST.length-1,Math.max(0,Math.floor(diff/7)));
  const id=WEEK_FIRST[wk];
  if(LESSONS.some(l=>l.id===id) && S.lesson!==id){ S.lesson=id; save(); }
}
applyWeekLesson();
render();
/* 수업 날짜가 지난 과(한국 시간 기준 하루 이상 지난 과)의 학습 기록을 모두 지웁니다. 수업 당일에는 자정까지 제출 화면이 그대로 보입니다. 반·언어·이름은 건드리지 않습니다 */
function purgeOldLessons(){
  try{
    const today=kstYmd(kstParts(nowMs())); let ch=false;
    Object.keys(SCHEDULE.lessons).forEach(lid=>{ if(SCHEDULE.lessons[lid]<today && S.data && S.data[lid]){ delete S.data[lid]; ch=true; } });
    if(ch) save();
    return ch;
  }catch(e){ return false; }
}
/* 시작: 서버 시각을 먼저 확인한 뒤 화면을 다시 그리고, 수업 시간이 바뀌면(열림·종료) 자동으로 갱신합니다 */
let lastWin='';
function tick(){ if(cur||wcur||tcur) return; const w=lessonWindow(S.lesson); if(w!==lastWin){ lastWin=w; render(); } }
syncTime().finally(()=>{ purgeOldLessons(); applyWeekLesson(); lastWin=lessonWindow(S.lesson); render(); });
setInterval(tick,20000);
setInterval(()=>{ syncTime().then(tick); },300000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncTime().then(()=>{ if(!cur && !wcur && !tcur && purgeOldLessons()) render(); tick(); }); });
</script>
