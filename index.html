<!doctype html>
<html lang=ko>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기초생활중국어 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf2f1; --card:#fbfdfc; --ink:#14302b; --muted:#5d746f; --line:#d3e0dc;
  --blue:#1f4e9c; --blue-soft:#e3ebf8; --ok:#1c7f55; --ok-soft:#dff2e8; --warn:#9a5b00; --warn-soft:#fbefd6;
  --bad:#b3372c; --grid:#b9cdc8;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --hanzi:"Noto Serif SC","Songti SC","Noto Serif CJK SC","SimSun",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1620; --card:#16222f; --ink:#e6f0ee; --muted:#9bb2ad; --line:#2a3b4a;
    --blue:#8fb0ff; --blue-soft:#1e2e4d; --ok:#5cc48f; --ok-soft:#163528; --warn:#e8b25a; --warn-soft:#3a2e14;
    --bad:#ff8a7c; --grid:#38505a;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1620; --card:#16222f; --ink:#e6f0ee; --muted:#9bb2ad; --line:#2a3b4a;
  --blue:#8fb0ff; --blue-soft:#1e2e4d; --ok:#5cc48f; --ok-soft:#163528; --warn:#e8b25a; --warn-soft:#3a2e14;
  --bad:#ff8a7c; --grid:#38505a;
}
/* 제출 화면 '연습이 필요한 문장' 전용 색: 모든 기기에서 푸른색(정확한 발음) / 연한 붉은색(연습할 발음) */
:root{--tg:var(--blue); --tb:#c8625a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--tb:#f0a095} }
:root[data-theme="dark"]{--tb:#f0a095}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-bottom:84px;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:15px;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.namerow{display:flex;gap:8px;align-items:stretch}
.namerow .name{flex:1;min-width:0;width:auto;text-overflow:ellipsis}
.clssel{flex:none;width:auto;max-width:96px;padding:11px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.clssel.sel{border-color:var(--blue);color:var(--blue);font-weight:700}
.clssel.need{border-color:var(--bad);color:var(--bad)}
.lockbox{text-align:center;padding:22px 16px}
.lockbox h2{margin:0 0 6px;font-size:18px}
.lockbox p{margin:4px 0;font-size:14px}
.lockbox ul{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
.lockbox li{margin:4px 0}
body.locked #chips, body.locked #view, body.locked #tabs{display:none}
#lock[hidden]{display:none}
.rall{flex:none;font-size:20px;line-height:1;padding:4px 14px;color:var(--mute,#6b7a76);white-space:nowrap}
.name{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -14px;padding-left:14px;padding-right:14px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;min-width:132px}
.chip b{display:block;font-size:14px}
.chip span{font-size:12px;color:var(--muted)}
.chip.on{border-color:var(--blue);background:var(--blue-soft)}
.chip.done span{color:var(--ok);font-weight:700}
.langs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.lg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.lg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0}
.s{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.s.pass{border-color:var(--ok)}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.cell{width:46px;height:46px;display:grid;place-items:center;font-family:var(--hanzi);font-size:28px;line-height:1;
  border:1.5px solid var(--grid);border-radius:3px;
  background:
    linear-gradient(to right,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px)) ,
    linear-gradient(to bottom,transparent calc(50% - .5px),var(--grid) calc(50% - .5px),var(--grid) calc(50% + .5px),transparent calc(50% + .5px));
  background-size:100% 100%;opacity:1}
.cell span{position:relative;z-index:1}
.punc{font-family:var(--hanzi);font-size:24px;align-self:end;padding-bottom:6px;color:var(--muted)}
.py{font-size:15px;color:var(--blue);font-weight:500;margin:0}
.mean{font-size:15px;margin:2px 0 10px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 6px;cursor:pointer;min-height:44px}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.b.playing{background:var(--blue);color:#fff;border-color:var(--blue);animation:plpulse 1s ease-in-out infinite}
.b.failed{border-color:var(--bad);color:var(--bad)}
@keyframes plpulse{0%,100%{opacity:1}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.b.playing{animation:none}}
:root[data-theme="dark"] .b.pri{color:#0b1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b.pri{color:#0b1220}}
.b.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
/* 문장 버튼(전 과 공통): 왼쪽 두 열은 크게, 셀프확인·리셋 열은 절반 폭 */
.btns.bw{grid-template-columns:1fr 1fr .5fr}
.btns.bw .b{padding:10px 4px}
.btns.bw .b[data-act=rec],.btns.bw .b[data-act=stop]{grid-column:span 2}
.btns.bw .b[data-act=self],.btns.bw .b[data-act=sreset]{padding:4px 2px;font-size:12px;line-height:1.2;white-space:normal;word-break:keep-all}
.b.rs{color:var(--mute,#6b7a76);font-weight:500}
.b.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;background:var(--blue)}
.meter.good i{background:var(--ok)}
.res{font-size:13px;color:var(--muted);margin:2px 0}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin-left:6px}
.badge.self{background:var(--blue-soft);color:var(--blue)}
.card2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card2 h2{font-size:17px;margin:0 0 6px}
.card2 p{margin:6px 0}
a.lk{display:block;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;color:var(--blue);text-decoration:none;font-size:14px}
textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.q{margin:14px 0}
.q p{font-weight:700;margin:0 0 8px}
.o{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0;cursor:pointer}
.o.right{background:var(--ok-soft);border-color:var(--ok)}
.o.wrong{background:var(--warn-soft);border-color:var(--bad)}
.stamp{border:2px solid var(--ok);border-radius:14px;padding:14px;text-align:center;margin:10px 0 14px;background:var(--ok-soft)}
.stamp.no{border-color:var(--warn);background:var(--warn-soft)}
.stamp b{font-size:26px;display:block;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.todo{margin:8px 0 0;padding-left:18px;font-size:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
@media (min-width:560px){nav{max-width:532px;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
nav button{flex:1;border:0;background:transparent;padding:10px 4px 9px;font-size:13px;color:var(--muted);cursor:pointer;min-height:56px}
nav button.on{color:var(--blue);font-weight:700;box-shadow:inset 0 3px 0 var(--blue)}
nav button em{display:block;font-style:normal;font-size:20px;line-height:1.1}
.vr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.vr:last-child{border-bottom:0}
.vm{display:flex;gap:8px;align-items:center;text-align:right;font-size:15px}
.hz{font-family:var(--hanzi);font-size:22px}
.py2{font-size:13px;color:var(--blue);margin-left:6px;font-family:var(--sans);font-weight:500}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px}
.help summary{cursor:pointer;font-weight:700;color:var(--blue)}
.help ul{margin:8px 0 2px;padding-left:18px}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.small{font-size:12px;color:var(--muted)}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;cursor:pointer;padding:8px 0}

.lbl{display:inline-block;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:6px 0 2px}
.cell.hit{border-color:var(--ok);background-color:var(--ok-soft)}
.cell.miss{border-color:var(--warn);border-style:dashed;background-color:var(--warn-soft)}
.grp{font-size:13px;margin:16px 2px -4px;color:var(--muted)}
.grp b{color:var(--ink)}
.py,.mean{white-space:pre-line}
.gc{color:var(--ok);font-weight:700}
.mc{color:var(--warn);font-weight:700;text-decoration:underline dotted}
.hb{color:var(--tg);font-weight:700}
.hr{color:var(--tb);font-weight:700;text-decoration:underline dotted}
.help ol{margin:8px 0 2px;padding-left:20px}
.wl>summary{cursor:pointer;font-size:16px;font-weight:800;margin-bottom:6px}
.okmark{color:var(--ok);font-weight:800;margin-left:6px}
.scr{font-size:16px;margin:4px 0 2px;color:var(--ink)}
.scr b{font-size:24px;font-weight:800}
.hrd{font-size:15px;margin:2px 0;color:var(--muted)}
.hz2{font-size:22px;font-weight:600;color:var(--ink)}
.locked{opacity:.35;pointer-events:none;user-select:none}
.help li{margin:4px 0}
.vw{padding:10px 0;border-bottom:1px dashed var(--line)}
.vw:last-child{border-bottom:0}
.vh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.vbtns .b{min-height:40px;font-size:13px;padding:6px 4px}
/* 단어 카드 배치(전 과 공통): 한자·병음 | 듣기 | 말하기 / 뜻 | 비교하기(말하기 아래) */
.vg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;align-items:center}
.vg .vg-a{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;min-width:0}
.vg .vg-a .py2{margin-left:0}
.vg .b{min-height:40px;font-size:13px;padding:6px 10px;white-space:nowrap}
.vg .vg-m{grid-column:1 / 3;font-size:14px;color:var(--ink);text-align:left;min-width:0}
.vg .vg-c{grid-column:3}
.vg .res{grid-column:1 / -1;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>기초생활중국어 연습</h1>
  <div id="langs" class="langs"></div>
  <div id="chips" class="chips"></div>
  <div id="view"></div>
</div>
<nav id="tabs"></nav>

<script>
/* 원어민 MP3 (id → GitHub 상대경로) */
const AUDIO={

  '11-gege':'audio/11/words/11-02gege.mp3',

<script>
/* =====================================================================
   선생님 수정 구역 / TEACHER EDIT ZONE
   - 11~20과는 빈 칸(draft)만 만들어 둔 상태입니다. 본문(sentences)·단어(vocab)·퀴즈(quiz)를 채우면 활성화됩니다.
   - 문답처럼 두 줄짜리는 각각 문장으로 분리해서 제공
   - threshold: 자동 점수 통과 기준(%) / 초급은 낮게, 중급은 높게(이 기능은 나중 확인 후 기능 삭제)
   ===================================================================== */
const LESSONS = [];

/* 샘플 버전: 11~12과만 둡니다. */
for(let n=11;n<=12;n++){
 LESSONS.splice(n-11,0,{id:'l'+n, title:n+'과', level:'', threshold:60, draft:true,
    sentences:[], vocab:[], quiz:[]});
}


/* 11과: au = 원어민 MP3 id(AUDIO 안). 없으면 폰 TTS로 재생됩니다. */
Object.assign(LESSONS.find(l=>l.id==='l11'),{draft:false, 
sentences:[

  {zh:'我叫王芳芳。', py:'Wǒ jiào Wáng Fāngfang.', ko:'제 이름은 왕팡팡입니다.', en:'My name is Wang Fangfang.', vi:'Tên tôi là Vương Phương Phương.', mn:'Миний нэр Ван Фан Фан.', ja:'私は王芳芳といいます。', au:'11-s1'},
  {zh:'我爸爸是经理，他很忙。', py:'Wǒ bàba shì jīnglǐ, tā hěn máng.', ko:'우리 아빠는 매니저이고, 매우 바쁩니다.', en:'My dad is a manager. He is very busy.', vi:'Bố tôi là quản lý, ông ấy rất bận.', mn:'Миний аав менежер, тэр маш завгүй.', ja:'父はマネージャーで、とても忙しいです。', au:'11-s2'},
  {zh:'我妈妈是家庭主妇，她很漂亮。', py:'Wǒ māma shì jiātíng zhǔfù, tā hěn piàoliang.', ko:'우리 엄마는 가정주부이고, 매우 예쁩니다.', en:'My mom is a housewife. She is very pretty.', vi:'Mẹ tôi là nội trợ, bà ấy rất đẹp.', mn:'Миний ээж гэрийн эзэгтэй, тэр маш үзэсгэлэнтэй.', ja:'母は専業主婦で、とてもきれいです。', au:'11-s3'},
 ], 

vocab:[
  {zh:'爸爸', py:'bàba', ko:'아빠', en:'dad', vi:'bố', mn:'аав', ja:'お父さん', au:'11-baba'},
  {zh:'没有', py:'méiyǒu', ko:'없다', en:"to not have", vi:'không có', mn:'байхгүй', ja:'ない・いない', au:'11-meiyou'},
  {zh:'漂亮', py:'piàoliang', ko:'예쁘다', en:'pretty', vi:'đẹp', mn:'үзэсгэлэнтэй', ja:'きれい', au:'11-piaoliang'},
  {zh:'衣服', py:'yīfu', ko:'옷', en:'clothes', vi:'quần áo', mn:'хувцас', ja:'服', au:'11-yifu'},
  {zh:'约会', py:'yuēhuì', ko:'데이트하다, 약속하여 만나다', en:'to date; to meet by arrangement', vi:'hẹn hò, hẹn gặp', mn:'болзох, цаг товлон уулзах', ja:'デートする、会う約束をする', au:'11-yuehui'}

]});

/* 12과: 본문 8문답, 문답을 분리해서 총 16문장으로 구성 */
Object.assign(LESSONS.find(l=>l.id==='l12'),{draft:false, 
sentences:[

  {zh: "他有弟弟吗？",  py: "Tā yǒu dìdi ma?",  ko: "그는 남동생이 있어요?",  en: "Does he have a younger brother?",  vi: "Anh ấy có em trai không?",  mn: "Тэр дүү хүүтэй юу?",  ja: "彼には弟がいますか？",  au: "12-s1"},

function norm(t){ return String(t||'').replace(/[\s\p{P}\p{S}]/gu,''); }
/* 교재 글자(a) 중 학생이 말한 글자(b)와 순서대로 맞은 글자를 true로 표시 */
function lcsMark(a,b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]= a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  const hit=new Array(m).fill(false);
  let i=m, j=n;
  while(i>0 && j>0){
    if(a[i-1]===b[j-1]){ hit[i-1]=true; i--; j--; }
    else if(dp[i-1][j]>=dp[i][j-1]) i--;
    else j--;
  }
  return hit;
}
function scoreOf(target, said){
  const a=[...norm(target)], b=[...norm(said)];
  if(!a.length) return {sc:0, hit:[]};
  const hit=lcsMark(a,b);
  /* 점수 = 맞은 글자 수 ÷ 목표 글자 수 (인식된 글자가 더 많아도 감점하지 않음 → 틀린 글자가 없으면 100점).
     TODO: 옆 학생 목소리가 섞여 인식된 글자가 길어지는 경우의 안전장치는, 수업에 적용한 결과를 보고 결정하기로 함 */
  const sc=Math.round(hit.filter(Boolean).length/Math.max(a.length,1)*100);
  return {sc, hit};
}

/* 연습할 말: 점수 결과에서 맞지 않은 글자를 이어진 덩어리로 묶어 순서대로 돌려줌 */
function missedParts(zh, marks){
  const a=[...norm(zh)], out=[]; let cur='';
  for(let k=0;k<a.length;k++){

  if(cur) out.push(cur);
  return out;
}

const EV=()=>EVI18N[S.lang]||EVI18N.ko;
function srFailMsg(err){
  if(err==='not-allowed') return 'notAllowed';
  if(err==='language-not-supported') return 'langUnsupported';
  if(err==='network' || err==='service-not-allowed') return 'network';
  return 'noSpeech';
}
function finalize(c){
  if(c.final) return; c.final=true; if(cur===c) cur=null;
  armMicIdle();
  if(c.chunks.length){
    if(audioURL[c.key]) URL.revokeObjectURL(audioURL[c.key]);
    audioURL[c.key]=URL.createObjectURL(new Blob(c.chunks,{type:(c.mr&&c.mr.mimeType)||'audio/webm'}));
  }
  const d=D(c.lid)[c.k]; d.tried[c.i]=true; d.tc[c.i]=(d.tc[c.i]||0)+1;
  if(SR){
    const cands=c.texts.slice(); if(c.full) cands.push(c.full);
    let best=-1, bt='', bh=[];
    cands.forEach(t=>{ const r=scoreOf(c.target,t); if(r.sc>best){ best=r.sc; bt=t; bh=r.hit; } });
    if(best>0){
      /* 가장 좋았던 시도의 점수·글자 표시·인식된 말을 함께 저장 */
      if(d.best[c.i]==null || best>d.best[c.i]){
        d.best[c.i]=best; d.marks[c.i]=bh.map(x=>x?'1':'0').join(''); d.heard[c.i]=bt;
      }
      msg[c.key]=''; delete d.fr[c.i];
    }else{
      /* 인식된 말이 없거나 맞은 글자가 하나도 없으면(소음만 들어간 경우 포함) 모두 같게: 점수 0점 + "인식된 말이 없어요" 안내.
         마이크 허용·연결 오류는 각자의 안내를 그대로 보여 주고 점수는 만들지 않음 */
      const mk=srFailMsg(c.srErr);
      msg[c.key]=mk;
      /* 점수가 만들어지지 않은 사유를 문장별로 기록(제출 화면에서 교사가 폰 문제 여부를 볼 수 있게) */
      if(mk==='noSpeech'){ delete d.fr[c.i]; } else { d.fr[c.i]=mk; }
      if(mk==='noSpeech' && d.best[c.i]==null){ d.best[c.i]=0; delete d.marks[c.i]; delete d.heard[c.i]; }
    }
  }else{
    msg[c.key]='noSR'; d.fr[c.i]='noSR';
  }
  save();
  if(lesson().id===c.lid){ renderCard(c.k,c.i); renderChips(); }
}

const isPunc=ch=>/[\p{P}\p{S}\s]/u.test(ch);
/* marks: 글자별 '1'(잘 들림) / '0'(다시 들어 보기) 문자열. 줄바꿈이 있으면 질문/대답 두 줄로 보여 줍니다 */
function cells(zh, marks){
  let idx=0;
  const lines=String(zh).split('\n'), pair=lines.length>1;
  return lines.map((line,li)=>{
    const lab=pair?'<span class="lbl">'+(li===0?'질문':'대답')+'</span>':'';
    const cs=[...line].map(ch=>{
      if(isPunc(ch)) return '<span class="punc">'+esc(ch)+'</span>';
      const m=marks?marks[idx]:null; idx++;
      const cls= m==='1' ? ' hit' : (m==='0' ? ' miss' : '');
      return '<div class="cell'+cls+'"><span>'+esc(ch)+'</span></div>';
    }).join('');
    return lab+'<div class="cells" lang="zh-CN">'+cs+'</div>';
  }).join('');
}
function markedHTML(zh, marks, cG, cM){
  cG=cG||'gc'; cM=cM||'mc';
  let idx=0;
  return [...String(zh)].map(ch=>{
    if(ch==='\n') return '<br>';
    if(isPunc(ch)) return esc(ch);
    const m=marks?marks[idx]:null; idx++;
    return m==='1' ? '<span class="'+cG+'">'+esc(ch)+'</span>' : (m==='0' ? '<span class="'+cM+'">'+esc(ch)+'</span>' : esc(ch));
  }).join('');
}
function charLists(zh, marks){
  const good=[], weak=[]; let idx=0;
  [...String(zh)].forEach(ch=>{
    if(isPunc(ch)) return;
    const m=marks?marks[idx]:null; idx++;
    const arr= m==='1' ? good : (m==='0' ? weak : null);
    if(arr && !arr.includes(ch)) arr.push(ch);
  });
  return {good:good.join(' '), weak:weak.join(' ')};
}
function practiceHTML(s,d,i,best,autoOk){
  if(!autoOk || best>=100) return '';
  const parts=missedParts(s.zh, d.marks[i]);
  if(!parts.length) return '';
  return '<p class="hrd">'+esc(EV().prac)+': <span class="hz2" lang="zh-CN">'+esc(parts.join(' / '))+'</span></p>';
}
function cardHTML(l,k,i){
  const s=items(l,k)[i], key=l.id+':'+k+':'+i, d=D(l.id)[k], best=d.best[i], pass=iPass(l,k,i);
  const recording=cur && cur.key===key && !cur.stopping;
  const has=!!audioURL[key];
  const autoOk = best!=null && best>=l.threshold;
  const meaning=s[S.lang]||s.ko;
  let res='';
  if(best!=null){
    res='<div class="meter '+(autoOk?'good':'')+'"><i style="width:'+best+'%"></i></div>'+
        '<p class="scr">'+esc(EV().score)+' <b>'+esc(EV().pts(best))+'</b></p>'+
        (d.heard[i]?'<p class="hrd">'+esc(EV().heard)+': <span class="hz2" lang="zh-CN">'+esc(d.heard[i])+'</span></p>':'')+
        practiceHTML(s,d,i,best,autoOk);
  }
  const hint=(best!=null && best>0 && best<l.threshold && !msg[key])?'<p class="res">'+esc(EV().hint)+'</p>':'';
  const m=msg[key]?'<p class="res" style="color:var(--warn)">'+esc(EV()[msg[key]]||'')+'</p>':'';
  const at='data-k="'+k+'" data-i="'+i+'"';
  const resetOk = !recording && (best!=null || !!d.tried[i] || !!d.self[i] || has);
  return '<div class="s '+(pass?'pass':'')+'" id="c'+k+i+'">'+
    cells(s.zh, d.marks[i])+
    '<p class="py">'+esc(s.py)+(pass?(autoOk?'<span class="badge">통과</span>':'<span class="badge self">셀프통과</span>'):'')+'</p>'+
    '<p class="mean">'+esc(meaning)+'</p>'+
    '<div class="btns bw">'+
      '<button class="b" data-act="say" '+at+' data-r="1">🔊 '+esc(VT().listen)+'</button>'+
      (recording ? '<button class="b rec" data-act="stop" '+at+'>'+esc(VT().stop)+'</button>'
                 : '<button class="b pri" data-act="rec" '+at+'>'+esc(VT().speak)+'</button>')+
      '<button class="b" data-act="say" '+at+' data-r="0.6">🐢 '+esc(VT().slow)+'</button>'+
      '<button class="b" data-act="cmp" '+at+(has?'':' disabled')+'>'+esc(VT().cmp)+'</button>'+
      '<button class="b rs" data-act="sreset" '+at+(resetOk?'':' disabled')+'>↺ 리셋</button>'+
    '</div>'+res+hint+m+
  '</div>';
}
function renderCard(k,i){
  const l=lesson();
  const el=$('c'+k+i); if(el) el.outerHTML=cardHTML(l,k,i);
}
function listHTML(l,k){
  return items(l,k).map((_,i)=>cardHTML(l,k,i)).join('');
}

const VG=()=>VGATE[S.lang]||VGATE.ko;
function wordsDoneCount(l){ const d=D(l.id); return l.vocab.filter((_,i)=>d.wdone[i]).length; }
function quizOpen(l){ const d=D(l.id); return !!d.qopen || Object.keys(d.vq).length>0; }
function gateHTML(l){
  const n=l.vocab.length, x=wordsDoneCount(l), ok=x>=n, G=VG();
  return '<p class="small" id="qprog">'+esc(G.progress(x,n))+'</p><p class="small" id="qhint">'+esc(ok?G.ready:G.lock)+'</p>'+
    '<button class="b pri" id="qopenbtn" data-act="qopen"'+(ok?'':' disabled')+'>'+esc(G.startBtn)+'</button>';
}
function updGate(){
  const l=lesson(); if(S.tab!=='vocab' || quizOpen(l)) return;
  const n=l.vocab.length, x=wordsDoneCount(l), ok=x>=n, G=VG();
  const p=$('qprog'), h=$('qhint'), b=$('qopenbtn'), w=$('wprog');
  if(p) p.textContent=G.progress(x,n);
  if(h) h.textContent=ok?G.ready:G.lock;
  if(b) b.disabled=!ok;
  if(w) w.textContent=G.progress(x,n);
}

/* 단어 말하기: 점수·판정 없이 녹음 → 내 소리 듣기 → 원어민과 비교 (음성 인식은 쓰지 않음) */
/* 실제로 소리가 난 경우에만 ✔ 표시: 녹음 중 마이크 음량을 재서 목소리가 없으면 완료 처리하지 않음.
   너무 예민하면 VOICE_RMS 값을 낮추고(예 0.02), 조용한 소리도 통과되면 높이세요(예 0.05). */
const VOICE_RMS=0.03, VOICE_FRAMES=4;
function watchVoice(c){
  c.meter=false; c.voiced=0;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(); if(ctx.resume) ctx.resume();
    const src=ctx.createMediaStreamSource(c.stream), an=ctx.createAnalyser();
    an.fftSize=1024; src.connect(an);
    const buf=new Uint8Array(an.fftSize);
    c.meter=true;
    c.vt=setInterval(()=>{
      try{
        an.getByteTimeDomainData(buf);
        let sum=0; for(let k=0;k<buf.length;k++){ const v=(buf[k]-128)/128; sum+=v*v; }
        if(Math.sqrt(sum/buf.length)>VOICE_RMS) c.voiced++;
      }catch(e){ c.meter=false; }
    },50);
    c.vstop=()=>{ clearInterval(c.vt); try{src.disconnect();}catch(e){} try{ctx.close();}catch(e){} };
  }catch(e){ c.meter=false; }
}
let wcur=null; const wmsg={};
function vwHTML(l,i){
  const w=l.vocab[i], T=VT(), key=l.id+':v:'+i;
  const rec=!!(wcur && wcur.key===key && !wcur.stopping), has=!!audioURL[key];
  const meaning=esc(w[S.lang]||w.ko);
  const m=wmsg[key]?'<p class="res" style="color:var(--warn)">'+esc(VT()[wmsg[key]]||'')+'</p>':'';
  return '<div class="vw vg" id="vw'+i+'">'+
    '<div class="vg-a"><b class="hz" lang="zh-CN">'+esc(w.zh)+'</b><span class="py2">'+esc(w.py)+'</span>'+(D(l.id).wdone[i]?'<span class="okmark">✔</span>':'')+'</div>'+
    '<button class="b" data-act="vsay" data-i="'+i+'">🔊 '+esc(T.listen)+'</button>'+
    (rec?'<button class="b rec" data-act="wstop" data-i="'+i+'">'+esc(T.stop)+'</button>':'<button class="b pri" data-act="wrec" data-i="'+i+'">'+esc(T.speak)+'</button>')+
    '<span class="vg-m">'+meaning+'</span>'+
    '<button class="b vg-c" data-act="wcmp" data-i="'+i+'"'+(has?'':' disabled')+'>'+esc(T.cmp)+'</button>'+
    m+'</div>';
}
function renderWord(i){ const l=lesson(), el=$('vw'+i); if(el && l.vocab[i]) el.outerHTML=vwHTML(l,i); }
async function startWord(i){
  if(wcur||cur) return;
  const l=lesson(), key=l.id+':v:'+i;
  if(synth) synth.cancel();
  stopRef();
  const c={key,i,lid:l.id,chunks:[]};
  wcur=c; wmsg[key]=''; renderWord(i);
  try{
    c.stream=await getMic();
    const mime=recMime();
    c.mr=mime?new MediaRecorder(c.stream,{mimeType:mime}):new MediaRecorder(c.stream);
    c.mr.ondataavailable=e=>{ if(e.data && e.data.size) c.chunks.push(e.data); };
    c.mr.onstop=()=>finishWord(c);
    c.mr.start(250);
    watchVoice(c);
  }catch(e){
    wcur=null; wmsg[key]='micFail';
    /* 마이크를 쓸 수 없는 폰에서도 막히지 않도록 이 단어는 말하기 완료로 처리 (선생님이 대면에서 확인) */
    D(l.id).wdone[i]=true; save();
    renderWord(i); updGate(); return;
  }
  c.timer=setTimeout(stopWord,4000);
}
function stopWord(){
  const c=wcur; if(!c||c.stopping) return;
  c.stopping=true; clearTimeout(c.timer);
  try{ if(c.mr && c.mr.state!=='inactive') c.mr.stop(); else finishWord(c); }catch(e){ finishWord(c); }
  if(lesson().id===c.lid) renderWord(c.i);
}
function finishWord(c){
  if(c.done) return; c.done=true; if(wcur===c) wcur=null;
  armMicIdle();
  if(c.vstop) c.vstop();
  if(c.chunks.length){
    if(audioURL[c.key]) URL.revokeObjectURL(audioURL[c.key]);
    audioURL[c.key]=URL.createObjectURL(new Blob(c.chunks,{type:(c.mr&&c.mr.mimeType)||'audio/webm'}));
    /* 음량 감지가 되는 기기에서는 목소리가 있었을 때만 완료, 감지가 안 되는 기기는 예전처럼 완료 처리 */
    const heard=c.meter ? c.voiced>=VOICE_FRAMES : true;
    if(heard){ D(c.lid).wdone[c.i]=true; save(); }
    else wmsg[c.key]='noVoice';
  }
  if(lesson().id===c.lid && S.tab==='vocab'){ renderWord(c.i); updGate(); }
}
function renderTabs(){
  const T=tabsOf(lesson());
  if(!T.some(t=>t[0]===S.tab)) S.tab='vocab';
  $('tabs').innerHTML=T.map(t=>'<button class="'+(S.tab===t[0]?'on':'')+'" data-act="tab" data-id="'+t[0]+'"><em>'+t[1]+'</em>'+t[2]+'</button>').join('');
}

function drillView(l,k){
  let h='';
  const arr=items(l,k);
  if(!arr.length) return '<div class="card2"><h2>'+KLABEL[k]+' 준비 중</h2><p>곧 등록돼요. 먼저 <b>단어 탭</b>에서 연습하세요.</p></div>';
  if(synth && voicesKnown>0 && !zhVoice) h+='<div class="notice">이 휴대폰에 중국어 음성이 없을 수 있어요. 소리가 안 나면 휴대폰 설정에서 중국어(Chinese) 음성을 설치해 주세요.</div>';
  if(!SR) h+='<div class="notice">이 브라우저는 자동 점수를 지원하지 않아요. 녹음 후 원어민 소리와 비교해 보세요. (자동 점수는 휴대폰 Chrome에서 가장 잘 됩니다.)</div>';
  else if(isPhone) h+='<div class="notice"></div>';
  return h+textHelpHTML()+listHTML(l,k);
}
function renderView(){
  const l=lesson(), d=D(l.id); let h='';
  if(!l.sentences.length && !l.vocab.length){
    $('view').innerHTML='<div class="card2"><h2>'+esc(LT(l))+' '+(CHIPT[S.lang]||CHIPT.ko).prep+'</h2><p>본문과 단어가 아직 등록되지 않았어요. 선생님이 등록하면 여기에 나타납니다.</p></div>';
    return;
  }
  if(S.tab==='quiz' && !l.quiz.length){ $('view').innerHTML='<div class="card2"><h2>퀴즈 준비 중</h2><p>곧 등록돼요. 먼저 단어 탭에서 연습하세요.</p></div>'; return; }
  if(S.tab==='practice') h+=drillView(l,'p');
  if(S.tab==='vocab'){
    const n=l.vocab.length, k=Math.min(4,n), T=VT();
    if(!n){ $('view').innerHTML='<div class="card2"><h2>단어 준비 중</h2><p>곧 등록돼요.</p></div>'; return; }
    const optsOf=i=>{ const o=[]; for(let j=0;j<k;j++) o.push((i+j)%n); const r=(i*3+1)%k; return o.slice(r).concat(o.slice(0,r)); };
    h+=vocabHelpHTML();
    h+='<details class="card2 wl" id="wl" open><summary>'+esc(T.listHead(n))+' <span class="small" id="wprog">'+esc(VG().progress(wordsDoneCount(l),n))+'</span></summary>'+l.vocab.map((w,i)=>vwHTML(l,i)).join('')+'</details>';
  }
  if(S.tab==='quiz'){
    h+=quizGuideHTML();
    h+='<div class="card2"><h2>확인 문제</h2>';
    l.quiz.forEach((q,qi)=>{
      const a=d.quiz[qi];
      h+='<div class="q"><p>'+(qi+1)+'. '+esc(q.q)+'</p>'+q.o.map((o,oi)=>{
        let cls=''; if(a!=null){ if(oi===q.a) cls='right'; else if(oi===a) cls='wrong'; }
        return '<button class="o '+cls+'" data-act="ans" data-q="'+qi+'" data-o="'+oi+'">'+esc(o)+'</button>';
      }).join('')+'</div>';
    });
    if(quizDone(l)) h+='<p><b>결과: '+quizScore(l)+' / '+l.quiz.length+'</b></p><button class="reset" data-act="quizreset">문제 다시 풀기</button>';
    h+='</div>';
  }
  if(S.tab==='card'){
    const ok=lessonPass(l);
    const kinds=['p'];
    const todo=[], helpItems=[];
    if(!vocabDone(l)) todo.push('단어 퀴즈 마무리 필요');
    let rows='';
    kinds.forEach(k=>{
      const dk=d[k], arr=items(l,k);
      const spoken=i=>dk.best[i]!=null && dk.best[i]>=l.threshold;          /* 발화로 통과(60점 이상) */
      const selfOnly=i=>!spoken(i) && !!dk.self[i];                        /* 셀프확인으로 통과 */
      rows+='<div class="kv"><span>'+KLABEL[k]+'</span><span>'+arr.filter((_,i)=>spoken(i)).length+' / '+arr.length+' 통과</span></div>'+
            '<div class="kv"><span>'+KLABEL[k]+' 셀프확인</span><span>'+arr.filter((_,i)=>selfOnly(i)).length+' / '+arr.length+'</span></div>';
      arr.forEach((s,i)=>{
        const b=dk.best[i], n=dk.tc&&dk.tc[i]||0;
        if(!spoken(i)){
          const parts=[], tried=!!dk.tried[i], why=FAILWHY[dk.fr&&dk.fr[i]];
          if(b!=null) parts.push('최고 '+b+'점');
          else if(tried) parts.push('점수 없음'+(why?': '+why:''));
          else parts.push('아직 안 함');
          if(n>0) parts.push(n+'회 시도');
          if(dk.self[i]) parts.push('셀프 확인');
          todo.push(KLABEL[k]+': “'+String(s.zh).replace(/\n/g,' ')+'” ('+parts.join(', ')+')');
        }
        /* 연습이 필요한 문장: 발화로 말해 본 문장 중 어려워한 글자가 있는 것 (셀프확인 통과·안 해 본 문장은 제외) */
        if(b!=null && !selfOnly(i)){
          const cl=charLists(s.zh, dk.marks[i]);
          if(cl.weak || (b<l.threshold && cl.good)) helpItems.push({k,i,s,b,n});
        }
      });
    });
    if(!l.sentences.length) todo.push('본문은 준비 중이에요');
    if(!quizDone(l)) todo.push('퀴즈를 모두 풀어 주세요');
    else l.quiz.forEach((q,qi)=>{ if(d.quiz[qi]!==q.a) todo.push('퀴즈 '+(qi+1)+'번 틀림'); });
    const helpHTML=helpItems.length?
      '<p style="margin:12px 0 2px"><b>연습이 필요한 문장</b></p><ul class="todo">'+helpItems.map(o=>{
        const mk=D(l.id)[o.k].marks[o.i];
        return '<li>['+KLABEL[o.k]+'] <span lang="zh-CN">'+markedHTML(o.s.zh, mk, 'hb', 'hr')+'</span> (최고 '+o.b+'점'+(o.n>0?', '+o.n+'회 시도':'')+')</li>';
      }).join('')+'</ul><p class="small">표시는 음성 인식 결과를 바탕으로 한 참고용입니다.</p>':'';
    h+=submitGuideHTML()+
      '<div class="card2"><div class="stamp '+(ok?'':'no')+'"><b>'+(ok?'통과 PASS ✔':'진행 중')+'</b><span>'+esc(LT(l))+(l.level?' ('+esc(l.level)+')':'')+'</span></div>'+
      '<div class="kv"><span>이름</span><span>'+esc(S.name||'(이름을 위에 입력하세요)')+'</span></div>'+
      '<div class="kv"><span>반</span><span>'+(S.cls?esc(S.cls)+'반':'(반을 위에서 선택하세요)')+'</span></div>'+
      '<div class="kv"><span>단어퀴즈</span><span>'+(l.vocab.length?(vocabDone(l)?vocabScore(l)+' / '+l.vocab.length+' 맞힘 ('+vocabPct(l)+'%)':'미완료'):'-')+'</span></div>'+
      (l.vocab.length && vocabDone(l)?'<div class="kv"><span>단어퀴즈 시도</span><span>'+histText(l).count+'회 ('+esc(histText(l).text)+')</span></div>':'')+
      rows+
      '<div class="kv"><span>퀴즈</span><span>'+(l.quiz.length?(quizDone(l)?quizScore(l)+' / '+l.quiz.length:'미완료'):'-')+'</span></div>'+
      '<div class="kv"><span>연습 시간</span><span>'+esc(practiceTimeText(d))+'</span></div>'+
      '<div class="kv"><span>일시</span><span>'+esc(new Date(nowMs()).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}))+'</span></div>'+
      (todo.length?'<p style="margin:12px 0 2px"><b>부족한 점</b></p><ul class="todo">'+todo.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
      helpHTML+
      '</div>';
  }
  $('view').innerHTML=h;
}
function practiceTimeText(d){
  const pt=d.pt; if(!pt||!pt.f) return '기록 없음';
  const a=kstParts(pt.f), b=kstParts(pt.l||pt.f), f=p=>pad2(p.m)+'/'+pad2(p.d)+' '+pad2(p.hh)+':'+pad2(p.mm);
  let t=kstYmd(a)===kstYmd(b) ? f(a)+' ~ '+pad2(b.hh)+':'+pad2(b.mm) : f(a)+' ~ '+f(b);
  const cs=(pt.c||'').split(',').filter(Boolean);
  if(cs.length && (cs.length>1 || cs[0]!==S.cls)) t+=' · 연습한 반: '+cs.map(c=>c+'반').join('·');
  return t;
}
function render(){ renderTabs(); renderChips(); renderView(); }

/* ----- 이벤트 ----- */
const NAME_PH='이름 / Name / Tên / Нэр / 名前';
function syncNameUI(){
  const has=!!(S.name||'').trim();
  if(has){ $('name').classList.remove('need'); $('name').placeholder=NAME_PH; }
}
/* 이름이 비어 있으면 말하기·퀴즈를 막고 이름 칸에 안내를 보여 줍니다 */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act, l=lesson(), i=+b.dataset.i, k=b.dataset.k, d=D(l.id);
  if(a==='tab'){ if(wcur) stopWord(); S.tab=b.dataset.id; if(S.tab!=='practice') releaseMic(); save(); render(); window.scrollTo(0,0); }
  else if(a==='lesson'){ if(cur) stopRec(); if(wcur) stopWord(); S.lesson=b.dataset.id; save(); render(); }
  else if(a==='lang'){ S.lang=b.dataset.id; save(); renderChips(); renderView(); }
  else if(a==='say'){ playVocab(b, items(l,k)[i], +b.dataset.r); }
  else if(a==='rec'){ startRec(k,i); }
  else if(a==='stop'){ stopRec(); }
  else if(a==='mine'){ playMine(l.id+':'+k+':'+i); }
  else if(a==='cmp'){ const key=l.id+':'+k+':'+i; if(!playRef(items(l,k)[i],0.9,()=>setTimeout(()=>playMine(key),300))) playMine(key); }
  else if(a==='self'){ { const bs=d[k].best[i]; if(bs!=null && bs>=l.threshold) return; } d[k].self[i]=!d[k].self[i]; save(); renderCard(k,i); renderChips(); }
  else if(a==='resetall'){
    if(cur||wcur){ alert(RTX().rec); return; }
    if(!confirm(RTX().all)) return;
    Object.keys(audioURL).forEach(k=>{ try{ URL.revokeObjectURL(audioURL[k]); }catch(e){} delete audioURL[k]; });
    Object.keys(msg).forEach(k=>delete msg[k]); Object.keys(wmsg).forEach(k=>delete wmsg[k]);
    /* 단어퀴즈 시도 기록(vh)은 '단어 다시 풀기'처럼 전체 리셋에서도 남깁니다 */
    /* 본문 시도 횟수(tc)도 같은 이유로 남깁니다 */
    const keep={}; Object.keys(S.data||{}).forEach(id=>{
      const dd=S.data[id]||{}, h=dd.vh, tc=dd.p&&dd.p.tc;
      const hasTc=tc && Object.keys(tc).length, pt=dd.pt;
      if((h&&h.length)||hasTc||pt){ keep[id]={}; if(h&&h.length) keep[id].vh=h.slice(); if(hasTc){ keep[id].p=blank(); keep[id].p.tc=Object.assign({},tc); } if(pt) keep[id].pt=Object.assign({},pt); }
    });
    S.data=keep; S.name=''; S.nameDate='';
    $('name').value=''; $('name').classList.remove('need'); $('name').placeholder=NAME_PH;
    save(); render(); window.scrollTo(0,0);
  }
  else if(a==='sreset'){
    const key=l.id+':'+k+':'+i, dd=d[k];
    if(cur && cur.key===key) return;
    if(iPass(l,k,i) && !confirm(RTX().one)) return;
    delete dd.best[i]; delete dd.tried[i]; delete dd.self[i]; delete dd.marks[i]; delete dd.heard[i]; if(dd.fr) delete dd.fr[i];
    if(audioURL[key]){ try{ URL.revokeObjectURL(audioURL[key]); }catch(e){} delete audioURL[key]; }
    delete msg[key];
    save(); renderCard(k,i); renderChips();
  }
  else if(a==='ans'){ const q=+b.dataset.q; if(d.quiz[q]==null){ d.quiz[q]=+b.dataset.o; save(); renderView(); renderChips(); } }
  else if(a==='quizreset'){ d.quiz={}; save(); renderView(); renderChips(); }
  else if(a==='vsay'){ playVocab(b, l.vocab[i], 1); }
  else if(a==='qopen'){ if(wordsDoneCount(l)>=l.vocab.length){ d.qopen=true; save(); renderView(); const q=$('vquiz'); if(q) q.scrollIntoView({block:'start'}); } }
  else if(a==='wrec'){ startWord(i); }
  else if(a==='wstop'){ stopWord(); }
  else if(a==='wmine'){ playMine(l.id+':v:'+i); }
  else if(a==='wcmp'){ const key=l.id+':v:'+i; if(!playRef(l.vocab[i],0.9,()=>setTimeout(()=>playMine(key),300))) playMine(key); }
  else if(a==='vans'){ const q=+b.dataset.q; if(d.vq[q]==null){ d.vq[q]=+b.dataset.o; if(vocabDone(l)) d.vh.push(vocabScore(l)); save(); renderView(); renderChips(); } }
  else if(a==='vreset'){ d.vq={}; save(); renderView(); renderChips(); }
});
render();
</script>
